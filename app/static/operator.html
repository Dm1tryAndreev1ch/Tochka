<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Точка — кабинет оператора</title><link rel="stylesheet" href="/static/style.css"><script type="module" src="/static/operator.js"></script></head><body>
